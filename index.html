<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oceavora - Underwater Experience Center</title>

    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body>
    <!-- Header -->
    <header>
      <img src="assets/oceavora.png" alt="logo" width="110" height="60" />

      <!-- Navigation -->
      <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="animals">Animals</a>
        <a href="#attractions">Attractions</a>
        <a href="#tickets">Tickets</a>
        <a href="#gallery">Gallery</a>
        <a href="#faq">FAQ</a>
        <a href="#contact">Contact</a>
      </nav>

      <button type="button" id="btnTicket" class="btn btn-md fw-bold">
        Buy Tickets
      </button>
    </header>

    <!-- Main Content -->
    <main>
      <!-- Home Section -->
      <section id="home">
        <div class="left-hero">
          <h6 class="text-white mb-10">EXPLORE, LEARN, PROTECT.</h6>

          <h1>Discover The Magic Under The <span class="sea">Sea</span></h1>

          <p>
            Oceavora is an Underwater Experience Center where you can explore
            the wonders of ocean life, get closer to amazing creatures, and
            learn how to protect our blue planet.
          </p>
        </div>

        <div class="left-hero-btn">
          <button type="button" id="btnTicket" class="btn btn-md fw-bold">
            Buy Tickets
          </button>

          <button type="button" id="btnExplore" class="btn btn-outline-light px-4 ms-3">Explore More</button>
        </div>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
